name: ADUGAME browser QA

on:
  push:
    branches: [qa-v2, qa-v3-parity, benchmark-v5]
  workflow_dispatch:

concurrency:
  group: adugame-browser-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Static syntax gate
        run: npm run syntax
      - name: G1R1 benchmark interaction probe
        run: npx playwright test qa/v5-00-g1r1.spec.js
      - name: G1R2 normal-play input gate
        run: npx playwright test qa/v5-15-production-input.spec.js
      - name: V6 all-nine presentation gate
        run: npx playwright test qa/v5-12-visual-quality-v6.spec.js qa/v5-13-visual-truth-v6.spec.js qa/v5-14-house-dynamic-visual-v6.spec.js
      - name: Full-cycle browser gate
        run: npm run test:e2e
      - name: Seven-category visual-flow gate
        run: npm run test:visual
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adugame-browser-qa-${{ github.ref_name }}
          path: |
            qa/reports/
            test-results/
          if-no-files-found: ignore

  webkit-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Install WebKit
        run: npx playwright install --with-deps webkit
      - name: WebKit syntax gate
        run: npm run syntax
      - name: Safari-engine v6 smoke and touch gate
        run: npm run test:webkit
      - name: Upload WebKit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adugame-webkit-smoke-${{ github.ref_name }}
          path: |
            qa/reports/webkit-playwright-report.json
            test-results/
          if-no-files-found: ignore
